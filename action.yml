name: "Mainfast Owners"
description: "Finds CODEOWNERS drift: unowned files a PR touches, owners who left the org or lost write access, missing teams, dead patterns and dormant owners."
author: "Mainfast authors"
branding:
  icon: "users"
  color: "blue"
inputs:
  mode:
    description: "auto (pull_request / pull_request_target -> pr, anything else -> audit), pr, or audit"
    default: auto
  token:
    description: "Token for the repository: CODEOWNERS, .mainfast.yml, the tree, PR files, public user lookups, collaborator permission, GitHub's CODEOWNERS errors, search, the PR comment. GITHUB_TOKEN works with contents: read and pull-requests: write. No checkout is needed."
    default: ${{ github.token }}
  org-token:
    description: "Optional token that can read the org (fine-grained PAT or GitHub App token with Organization > Members: read, plus Metadata: read on this repository). Enables org membership, team existence, team access and team-member dormancy checks. Without it those are skipped with one note. Never used for PRs from forks or from authors without write access."
    default: ""
  config:
    description: "Path to a .mainfast.yml in the workspace. Default: .mainfast.yml read through the API from the PR's base branch (pr) or the default branch (audit)."
    default: ""
  ref:
    description: "audit mode: branch or sha whose CODEOWNERS to audit. Default: the default branch."
    default: ""
  comment:
    description: Keep one PR comment listing unowned paths and problems in the PR's CODEOWNERS (pr mode).
    default: "true"
  comment-author:
    description: "Login the token posts as (e.g. my-app[bot] for a GitHub App token). Only a comment that starts with the Mainfast marker and was written by this login is ever edited. Default: the token's own user (GET /user), else github-actions[bot]."
    default: ""
  dormant-days:
    description: "audit mode: override owners.dormantDays (default 180; 0 turns the check off). Dormancy is never checked on pull requests."
    default: ""
  fail-on:
    description: "error, warning or never. Defaults to owners.failOn (error)."
    default: ""
  license:
    description: "Your Mainfast license key (Pro, or the optional free key), from the MAINFAST_LICENSE secret. Optional: no feature needs it, and public repositories and private ones with up to 5 active contributors never need it. Checked once per run with Polar (only the key and the organization id are sent; if Polar cannot be reached, the key counts as valid). Without a Pro key, a larger private repository gets one notice in the job summary; the result never changes."
    default: ""
outputs:
  ok:
    description: "true when no error-level finding"
  unowned:
    description: Unowned paths, one per line (pr mode; judged with the base branch's CODEOWNERS)
  report:
    description: Full report as JSON (findings with scope current/proposed, owners, orgChecks, dormancy, notes)
runs:
  using: node24
  main: "dist/index.cjs"
